<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
{{STYLES}}
/* Preview frame. Single light theme, matching the app. */
:root { --ground: #E9EFEF; --ink-1: #142B33; --ink-2: #5B6F75; --brand: #1A6F67; --deep: #0C2A30; --chip: #FFFFFF; color-scheme: light; }
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink-1); display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 16px; gap: 12px; }
[hidden] { display: none !important; }
.pv { flex: none; width: 100%; max-width: 480px; margin: 0 auto; display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; }
.pv-name { font-size: 14px; font-weight: 800; letter-spacing: -0.2px; }
.pv-meta { font-size: 11px; color: var(--ink-2); margin-left: auto; font-variant-numeric: tabular-nums; }
.seg { display: flex; gap: 4px; background: #DCE5E6; border-radius: 12px; padding: 4px; }
.seg button { border: 0; border-radius: 9px; background: transparent; color: var(--ink-2); font-size: 13px; font-weight: 700; min-height: 34px; padding: 0 14px; }
.seg button[aria-pressed="true"] { background: var(--chip); color: var(--ink-1); box-shadow: 0 1px 3px rgba(12, 42, 48, .14); }
body .app { width: 100%; flex: 1; min-height: 0; height: auto; max-height: 880px; margin: 0 auto; border-radius: 24px; box-shadow: 0 12px 48px rgba(12, 42, 48, .16); }
</style>
<header class="pv">
  <span class="pv-name">MediAUS · {{LABEL}}</span>
  <div class="seg" role="group" aria-label="Version">
    <button id="m-new" aria-pressed="true">Redesign</button>
    <button id="m-old" aria-pressed="false">Current</button>
  </div>
  <span class="pv-meta">{{BRANCH}} @ {{SHA}}</span>
</header>
<main id="app" class="app" aria-live="polite"></main>
<script>
{{DATA}}
</script>
<script>
{{APP}}
</script>
